name: Deploy to GitHub Pages

on:
  push:
    branches:
      - public-website

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
        working-directory: ./解壓縮

      - name: Build site
        run: npm run build
        working-directory: ./解壓縮
        env:
          VITE_TALENT_API_URL: https://script.google.com/macros/s/AKfycbxvY5tw-ZoJvg8flDWtM2xeNwaBnzy2YqT-sChOgeZQ1jm0K4ZVr4Sn3AShKdARmhwh/exec

      - name: Configure Pages
        id: configure_pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./解壓縮/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
