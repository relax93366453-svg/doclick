<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8" />
    <title>愜易居 – 重新導向</title>
    <script>
      // GitHub Pages SPA fallback
      // Encode the path, query, and hash into a redirect URL so BrowserRouter
      // can pick it up after the main index.html loads.
      // See: https://github.com/rafgraph/spa-github-pages
      var segmentCount = 1; // 1 = one path segment (repo name = /doclick)
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
